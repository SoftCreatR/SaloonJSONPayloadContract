name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.5' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: |
          if [ "${{ matrix.php }}" = "8.5" ]; then
            vendor/bin/phpunit --log-junit junit.xml --coverage-clover coverage.xml --coverage-text
            php tools/assert-coverage.php coverage.xml
          else
            vendor/bin/phpunit
          fi

      - name: Upload coverage
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  lowest:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - run: composer audit
      - run: composer test

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - run: composer validate --strict
      - run: composer audit
      - run: composer phpstan
      - run: composer cs
